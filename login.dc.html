<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0}</style>
</helmet>
<div data-screen-label="로그인" style="min-height:100vh;background:#F7F8FA;display:flex;align-items:center;justify-content:center;font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR',sans-serif;padding:24px;box-sizing:border-box">
  <div style="width:400px;max-width:100%;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div style="width:44px;height:44px;border-radius:12px;background:#4F46E5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;box-shadow:0 4px 12px rgba(79,70,229,.25)">SQL</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <h1 style="margin:0;font-size:22px;font-weight:700;color:#18181B;letter-spacing:-.01em">AI로 배우는 원데이 SQL</h1>
        <p style="margin:0;font-size:14px;color:#6B7280">수강생 전용 학습 플랫폼</p>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #E7E8EC;border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.05);padding:32px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:13px;border-radius:8px;padding:10px 12px">등록되지 않은 이메일입니다. 관리자에게 문의해 주세요.</div>
      </sc-if>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:600;color:#374151">이메일</label>
        <input type="email" placeholder="you@example.com" style="height:42px;border:1px solid #D8DAE0;border-radius:8px;padding:0 12px;font-size:14px;color:#18181B;outline:none;font-family:inherit;box-sizing:border-box" style-focus="border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.12)" />
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:600;color:#374151">비밀번호</label>
        <input type="password" placeholder="••••••••" style="height:42px;border:1px solid #D8DAE0;border-radius:8px;padding:0 12px;font-size:14px;color:#18181B;outline:none;font-family:inherit;box-sizing:border-box" style-focus="border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.12)" />
      </div>
      <a href="learn.dc.html" style="height:44px;background:#4F46E5;color:#fff;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:4px" style-hover="background:#4338CA">로그인</a>
    </div>
    <p style="margin:0;text-align:center;font-size:13px;color:#9CA3AF">수강 승인된 이메일로만 로그인할 수 있습니다</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showError: this.props.showError ?? false };
  }
}
</script>
</body>
</html>
