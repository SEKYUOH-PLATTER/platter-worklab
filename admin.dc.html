<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0}</style>
</helmet>
<div data-screen-label="관리자" style="min-height:100vh;background:#F7F8FA;font-family:'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR',sans-serif;color:#18181B;display:flex">

  <aside style="width:220px;flex:none;background:#fff;border-right:1px solid #E7E8EC;min-height:100vh;display:flex;flex-direction:column;padding:20px 12px;box-sizing:border-box;position:sticky;top:0">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px 20px">
      <div style="width:28px;height:28px;border-radius:8px;background:#4F46E5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800">SQL</div>
      <div style="display:flex;flex-direction:column">
        <span style="font-size:13.5px;font-weight:700;letter-spacing:-.01em">원데이 SQL</span>
        <span style="font-size:11px;color:#9CA3AF">관리자 콘솔</span>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="3">
        <button onClick="{{ n.onClick }}" style="{{ n.style }}">{{ n.name }}</button>
      </sc-for>
    </nav>
    <div style="margin-top:auto;border-top:1px solid #F0F1F4;padding-top:12px;display:flex;flex-direction:column;gap:2px">
      <a href="learn.dc.html" style="display:block;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#4B5563;text-decoration:none" style-hover="background:#F3F4F6">← 학습 페이지로</a>
      <a href="login.dc.html" style="display:block;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#4B5563;text-decoration:none" style-hover="background:#F3F4F6">로그아웃</a>
    </div>
  </aside>

  <main style="flex:1;min-width:0;padding:32px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;max-width:1000px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:4px">
        <h1 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em">{{ sectionTitle }}</h1>
        <span style="font-size:13px;color:#6B7280">{{ sectionDesc }}</span>
      </div>
      <button style="height:38px;padding:0 16px;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="background:#4338CA">＋ {{ addLabel }}</button>
    </div>

    <div style="background:#fff;border:1px solid #E7E8EC;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden">
      <div style="{{ headRowStyle }}">
        <sc-for list="{{ headers }}" as="h" hint-placeholder-count="4">
          <span style="padding:11px 20px;font-size:12px;font-weight:600;color:#6B7280;white-space:nowrap">{{ h }}</span>
        </sc-for>
        <span style="padding:11px 20px;font-size:12px;font-weight:600;color:#6B7280;text-align:right">작업</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="{{ r.rowStyle }}" style-hover="background:#FAFAFB">
          <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
            <span style="{{ c.style }}">{{ c.text }}</span>
          </sc-for>
          <span style="padding:12px 20px;display:flex;gap:12px;justify-content:flex-end;align-items:center">
            <button style="border:none;background:none;padding:0;font-size:12.5px;font-weight:600;color:#4F46E5;cursor:pointer;font-family:inherit" style-hover="text-decoration:underline">수정</button>
            <button style="border:none;background:none;padding:0;font-size:12.5px;font-weight:600;color:#DC2626;cursor:pointer;font-family:inherit" style-hover="text-decoration:underline">삭제</button>
          </span>
        </div>
      </sc-for>
    </div>

    <span style="font-size:12.5px;color:#9CA3AF">총 {{ totalLabel }}</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activeSection&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;문제 관리&quot;,&quot;데이터셋 관리&quot;,&quot;이메일 화이트리스트&quot;],&quot;default&quot;:&quot;문제 관리&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;상태&quot;}}">
class Component extends DCLogic {
  state = { section: null };

  sections() {
    const badge = (text, c, bg) => ({ text, style: { padding: '12px 20px', fontSize: '13px', display: 'flex', alignItems: 'center' }, chip: { c, bg } });
    return {
      '문제 관리': {
        desc: '학습 문제를 추가하고 수정합니다',
        add: '문제 추가',
        cols: '2fr 1fr 1fr 0.8fr 0.8fr 120px',
        headers: ['제목', '트랙', '도메인', '난이도', '상태'],
        rows: [
          ['월별 매출 추이 구하기', '실전 케이스', '이커머스', ['Medium', '#B45309', '#FFFBEB'], ['공개', '#166534', '#F0FDF4']],
          ['재구매율 계산하기', '실전 케이스', '이커머스', ['Hard', '#B91C1C', '#FEF2F2'], ['공개', '#166534', '#F0FDF4']],
          ['GROUP BY로 집계하기', '문법 실습', '—', ['Medium', '#B45309', '#FFFBEB'], ['공개', '#166534', '#F0FDF4']],
          ['이상 거래 탐지 후보 찾기', '실전 케이스', '핀테크', ['Hard', '#B91C1C', '#FEF2F2'], ['비공개', '#6B7280', '#F3F4F6']],
          ['부서별 평균 근속연수', '실전 케이스', 'HR', ['Easy', '#15803D', '#ECFDF5'], ['공개', '#166534', '#F0FDF4']]
        ],
        total: '261개 문제'
      },
      '데이터셋 관리': {
        desc: '문제에서 사용하는 샘플 데이터베이스를 관리합니다',
        add: '데이터셋 추가',
        cols: '1.6fr 1fr 0.8fr 0.8fr 1fr 120px',
        headers: ['이름', '도메인', '테이블 수', '행 수', '업데이트'],
        rows: [
          ['ecommerce_demo', '이커머스', '4', '128,400', '2026-06-21'],
          ['saas_metrics', 'SaaS', '6', '86,200', '2026-06-18'],
          ['fintech_txn', '핀테크', '3', '542,000', '2026-06-10'],
          ['logistics_ops', '물류', '5', '213,750', '2026-05-30'],
          ['hr_core', 'HR', '4', '9,340', '2026-05-12']
        ],
        total: '12개 데이터셋'
      },
      '이메일 화이트리스트': {
        desc: '로그인이 허용된 수강생 이메일을 관리합니다',
        add: '이메일 추가',
        cols: '2fr 1fr 0.8fr 120px',
        headers: ['이메일', '등록일', '상태'],
        rows: [
          ['minji.kim@example.com', '2026-06-28', ['활성', '#166534', '#F0FDF4']],
          ['jh.park@example.com', '2026-06-28', ['활성', '#166534', '#F0FDF4']],
          ['soyeon.lee@example.com', '2026-06-25', ['활성', '#166534', '#F0FDF4']],
          ['dw.choi@example.com', '2026-06-21', ['대기', '#B45309', '#FFFBEB']],
          ['yuna.jang@example.com', '2026-06-14', ['활성', '#166534', '#F0FDF4']]
        ],
        total: '48명'
      }
    };
  }

  renderVals() {
    const all = this.sections();
    const names = Object.keys(all);
    const active = this.state.section ?? (names.includes(this.props.activeSection) ? this.props.activeSection : names[0]);
    const sec = all[active];

    const cellStyle = { padding: '12px 20px', fontSize: '13px', color: '#374151', display: 'flex', alignItems: 'center', minWidth: 0, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' };

    const rows = sec.rows.map((cells, ri) => ({
      rowStyle: { display: 'grid', gridTemplateColumns: sec.cols, borderTop: '1px solid #F0F1F4' },
      cells: cells.map((c, ci) => {
        if (Array.isArray(c)) {
          return {
            text: c[0],
            style: { margin: '9px 20px', alignSelf: 'center', justifySelf: 'start', fontSize: '12px', fontWeight: 600, color: c[1], background: c[2], borderRadius: '6px', padding: '3px 9px', whiteSpace: 'nowrap' }
          };
        }
        const first = ci === 0;
        return { text: c, style: { ...cellStyle, fontWeight: first ? 600 : 400, color: first ? '#18181B' : '#4B5563', fontFamily: active === '이메일 화이트리스트' && first ? 'ui-monospace,Menlo,monospace' : 'inherit', fontSize: first ? '13.5px' : '13px' } };
      })
    }));

    const navItems = names.map(name => {
      const sel = name === active;
      return {
        name,
        onClick: () => this.setState({ section: name }),
        style: { textAlign: 'left', padding: '9px 12px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: '13.5px', fontWeight: sel ? 600 : 500, background: sel ? '#EEF2FF' : 'transparent', color: sel ? '#4338CA' : '#4B5563' }
      };
    });

    return {
      navItems,
      sectionTitle: active,
      sectionDesc: sec.desc,
      addLabel: sec.add,
      headers: sec.headers,
      headRowStyle: { display: 'grid', gridTemplateColumns: sec.cols, background: '#F9FAFB' },
      rows,
      totalLabel: sec.total
    };
  }
}
</script>
</body>
</html>
